aid: origin-protocol
name: Origin Protocol
description: 'Origin Protocol builds permissionless DeFi infrastructure for yield-bearing
  tokens on Ethereum and L2s. Its products include Origin Ether (OETH) and Super OETH
  liquid-staking tokens, the Origin Dollar (OUSD) yield-bearing stablecoin, Origin
  Sonic (OS), the Automated Redemption Manager (ARM) arbitrage vaults, and the OGN
  governance/value-accrual token backed by protocol-revenue buybacks. Origin publishes
  a public read-only Analytics REST API (api.originprotocol.com) that wraps its
  origin-squid indexer, exposing yield, supply, collateral, revenue, and buyback
  data. Backed by Pantera Capital; surfaced into the API Evangelist network and
  enriched from Origin''s own developer surfaces.'
