openapi: 3.2.0
info:
  title: defi-analytics Supply API
  description: API for defi-analytics
  version: 1.0.0
servers:
- url: http://localhost:8787
  description: Local server
- url: https://api.originprotocol.com
  description: Production server
tags:
- name: Supply
paths:
