    get:
      responses:
        '200':
          description: OETH circulating supply
          content:
            application/json:
              schema:
                type: number
      operationId: getCirculating-oeth
      tags:
      - Supply
      parameters: []
      description: Get OETH circulating supply
      summary: Get circulating oeth
      x-summary-source: derived
